# CFG-01-compose: ARC-01 as one compose file – agent without network, Squid sidecar, Unix-socket bridge
# Lives in the project's .devcontainer/ folder; the agent sees this folder read-only (README.md, AD-01)
# Relative paths resolve against this folder: '.' is .devcontainer/, '..' is the project root
# Run as your normal user, never with sudo: the agent would otherwise run as UID 0
# sbx-init.sh writes PROJECT and P to .env before every start (devcontainer.json, pm-comp.sh)
name: ${P:?run sbx-init.sh first; it writes P and PROJECT to .env}

# Shared hardening: no capabilities and no privilege gain (HRD-01, HRD-02)
x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

# Proxy variables point at the agent's local bridge; empty values override host proxies (PIT-14)
x-proxy-env: &proxy-env
  HTTPS_PROXY: http://127.0.0.1:3128
  https_proxy: http://127.0.0.1:3128
  HTTP_PROXY: http://127.0.0.1:3128
  http_proxy: http://127.0.0.1:3128
  NO_PROXY: localhost,127.0.0.1,::1
  no_proxy: localhost,127.0.0.1,::1
  ALL_PROXY: ""
  all_proxy: ""
  FTP_PROXY: ""
  ftp_proxy: ""
  NODE_USE_ENV_PROXY: "1"
  DISABLE_TELEMETRY: "1"
  DISABLE_ERROR_REPORTING: "1"

# Published images by default; `up --build` builds them from the Dockerfiles in this folder instead.
# missing: pull only when the image is not present locally; `docker compose pull` fetches a newer :latest
x-agent-image: &agent-image
  image: ${AGENT_IMAGE:-ghcr.io/bugrasan/devcontainer-base-ai/sbx-agent:latest}
  pull_policy: missing

services:
  # One-shot: hand the socket volume to Squid's UID 13; Docker has no :U volume option
  socket-owner:
    <<: [*hardening, *agent-image]
    build:
      context: .
      dockerfile: Dockerfile.agent
    user: "0"
    cap_add: [CHOWN]
    network_mode: none
    volumes:
      - egress:/run/egress
    command: ["chown", "13:13", "/run/egress"]
    restart: "no"

  # Squid sidecar: the only service with a network (the project's default network)
  # socat links the socket file to Squid; wait -n ends the container when either dies,
  # and the restart policy brings it back
  egress-proxy:
    <<: *hardening
    image: ${PROXY_IMAGE:-ghcr.io/bugrasan/devcontainer-base-ai/sbx-proxy:latest}
    pull_policy: missing
    build:
      context: .
      dockerfile: Dockerfile.proxy
    user: "13:13"
    read_only: true
    tmpfs: [/tmp]
    environment: *proxy-env
    volumes:
      - ./squid.conf:/config/squid.conf:ro
      - egress:/run/egress
    command:
      - bash
      - -c
      - |
        squid -N -f /config/squid.conf &
        socat UNIX-LISTEN:/run/egress/http.sock,fork,mode=666,unlink-early TCP:127.0.0.1:3128 &
        wait -n; exit 1
    restart: unless-stopped
    depends_on:
      socket-owner:
        condition: service_completed_successfully

  # Agent: no network at all; socat turns its local proxy port into the socket file
  # The project root is its workspace; .devcontainer/, .git/, and .copilot/ are mounted read-only
  # on top, so the agent cannot change its own policy or files that host tools run (HRD-13).
  # create_host_path: false fails the start instead of creating root-owned folders on the host;
  # sbx-init.sh creates missing .git/ and .copilot/ folders first
  agent:
    <<: [*hardening, *agent-image]
    user: "${AGENT_UID:-1000}:${AGENT_GID:-1000}"
    network_mode: none
    environment: *proxy-env
    working_dir: /workspaces/${PROJECT:?run sbx-init.sh first}
    volumes:
      - type: bind
        source: ..
        target: /workspaces/${PROJECT}
        bind: {create_host_path: false}
      - type: bind
        source: .
        target: /workspaces/${PROJECT}/.devcontainer
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.git
        target: /workspaces/${PROJECT}/.git
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../.copilot
        target: /workspaces/${PROJECT}/.copilot
        read_only: true
        bind: {create_host_path: false}
      - egress:/run/egress:ro
    command:
      - bash
      - -c
      - |
        socat TCP-LISTEN:3128,bind=127.0.0.1,fork,reuseaddr UNIX-CONNECT:/run/egress/http.sock &
        wait -n; exit 1
    restart: unless-stopped
    depends_on:
      egress-proxy:
        condition: service_started

volumes:
  egress: {}
