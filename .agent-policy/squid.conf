# Egress allowlist: hostnames; a leading dot means the domain and all subdomains
# -n: never resolve, so names outside the allowlist cause no DNS query and IP targets are never reverse-resolved
acl vscode    dstdomain -n marketplace.visualstudio.com .gallery.vsassets.io .gallerycdn.vsassets.io .vscode-cdn.net
acl claude    dstdomain -n api.anthropic.com claude.ai claude.com platform.claude.com downloads.claude.ai
acl copilot   dstdomain -n github.com api.github.com .githubcopilot.com copilot-proxy.githubusercontent.com origin-tracker.githubusercontent.com github.githubassets.com avatars.githubusercontent.com
acl harness   dstdomain -n registry.npmjs.org release-assets.githubusercontent.com
# Project-specific entries: replace or remove
acl project   dstdomain -n .codeberg.org
acl lan       dst -n 192.168.1.67 192.168.1.68
acl allowlist any-of vscode claude copilot harness project lan
acl private   dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4 ::/128 ::1 64:ff9b:1::/48 2001::/32 2002::/16 fc00::/7 fe80::/10 ff00::/8
acl SSL_ports port 443
acl CONNECT   method CONNECT
http_access deny !CONNECT
http_access deny !SSL_ports
http_access deny !allowlist
http_access allow lan
http_access deny private
http_access allow allowlist
http_access deny all
http_port 127.0.0.1:3128
cache deny all
pid_filename none
hosts_file none
pinger_enable off
access_log stdio:/dev/stdout
cache_log stdio:/dev/stderr
coredump_dir /tmp
